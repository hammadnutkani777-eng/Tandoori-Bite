        Tandoori Bites
      </span>
    </div>

    <!-- Center Search Bar -->
    <div class="flex-1 flex justify-center mx-4">
      <input
        type="search"
        placeholder="Search food...."
        class="w-full max-w-[300px] sm:max-w-[400px] md:max-w-[450px] lg:max-w-[600px]
               px-4 py-2 rounded-full
               bg-white text-gray-800
               border-3 border-black
               focus:outline-none focus:ring-2 focus:ring-black"
      >
    </div>

    <!-- Right Menu -->
    <ul class="hidden sm:flex ml-auto gap-6 text-[#7209b7] bg-white font-[Salsa] font-semibold text-base lg:text-lg">
      <li class="hover:text-yellow-500 transition"><a href="index.html">Home<i class="fa-solid fa-house" style="color: #000000;"></i></a></li>
      <li class="hover:text-yellow-500 transition"><a href="Menu.html">Menu<i class="fa-solid fa-clipboard-list" style="color: #000000;"></i></a></li>
      <li class="hover:text-yellow-500 transition"><a href="cart.html">Cart<i class="fa-solid fa-cart-shopping" style="color: #000000;"></i></a></li>
      <li class="hover:text-yellow-500 transition"><a href="OurLocation.html">Our Location<i class="fa-solid fa-map-location-dot" style="color: #000000;"></i></a></li>
    </ul>

  </div>

  <!-- Mobile Menu -->
  <ul class="sm:hidden flex justify-around bg-[#faedcd] text-black font-[Salsa] font-semibold text-sm py-3">
    <li class="hover:bg-blue-300 transition"><a href="index.html">Home<i class="fa-solid fa-house" style="color: #1d49e7;"></i></a></li>
    <li class="hover:bg-blue-300 transition"><a href="Menu.html">Menu<i class="fa-solid fa-clipboard-list" style="color: #1d49e7;"></i></a></li>
    <li class="hover:bg-blue-300 transition"><a href="cart.html">Cart<i class="fa-solid fa-cart-shopping" style="color: #1d49e7;"></i></a></li>
    <li class="hover:bg-blue-300 transition"><a href="OurLocation.html">Location<i class="fa-solid fa-map-location-dot" style="color: #1d49e7;"></i></a></li>
  </ul>
</nav>

<div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-center text-white">🛒 Your Cart</h1>

    <div id="cartItems" class="space-y-4"></div>

    <div class="mt-6 text-right">
      <h2 class="text-xl font-bold">
        Total: Rs <span id="totalPrice">0</span>
      </h2>
    </div>

    <div class="mt-6 flex justify-between">
      <a href="index.html"
         class="bg-gray-600 text-white px-6 py-2 rounded-full hover:bg-gray-700 cursor-pointer">
        ← Continue Shopping
      </a>

      <button
        class="bg-green-600 text-white px-6 py-2 rounded-full hover:bg-green-700 cursor-pointer">
        Checkout
      </button>
    </div>
  </div>

<script>
function loadCart() {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartItems = document.getElementById("cartItems");
  const totalPriceEl = document.getElementById("totalPrice");

  cartItems.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartItems.innerHTML = `
      <p class="text-center text-gray-500">Your cart is empty 😔</p>
    `;
    totalPriceEl.innerText = 0;
    return;
  }

  cart.forEach((item, index) => {
    total += item.price * item.qty;

    cartItems.innerHTML += `
      <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
        <div>
          <h3 class="font-bold text-lg">${item.name}</h3>
          <p class="text-gray-600">Rs ${item.price} × ${item.qty}</p>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="changeQty(${index}, -1)"
            class="bg-gray-300 px-3 rounded">−</button>

          <span class="font-semibold">${item.qty}</span>

          <button onclick="changeQty(${index}, 1)"
            class="bg-gray-300 px-3 rounded">+</button>

          <button onclick="removeItem(${index})"
            class="bg-red-500 text-white px-3 py-1 rounded">
            Remove
          </button>
        </div>
      </div>
    `;
  });

  totalPriceEl.innerText = total;
}

function changeQty(index, change) {
  let cart = JSON.parse(localStorage.getItem("cart"));
  cart[index].qty += change;

  if(cart[index].qty <= 0) {
    cart.splice(index, 1);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart"));
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

loadCart();
</script>

</body>
</html>
